name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        # Зависимости движка/тестов: lxml (правки XML метаданных), openpyxl/xlrd (storage_map), mcp, pytest.
        # mcp<2: релиз mcp 2.0.0 убрал mcp.server.fastmcp, на который завязаны серверы; держим 1.x до миграции.
        run: uv run --no-project --with "mcp<2" --with pytest --with lxml --with openpyxl --with xlrd pytest tests/ -q
